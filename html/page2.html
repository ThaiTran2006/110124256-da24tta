<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="stylesheet" href="../css/style2.css">
    <meta charset="UTF-8">
    <title>Thiết kế form</title>
</head>
<body>
    <div class="container">
        <!-- Tiêu đề -->
        <h1 id="title">THIẾT KẾ TRANG LOG ACC</h1>

        <form id="frmLogin">
            <div class="form-group">
                <label for="txtUsername">Tài Khoản:</label>
                <input class="control" type="text" id="txtUsername" name="txtUsername">
            </div>

            <div class="form-group">
                <label for="txtPassword">Mật khẩu:</label>
                <input class="control" type="password" id="txtPassword" name="txtPassword">
            </div>
            <input type="submit" name="sbLogin" id="txtLogin" value="Đăng nhập">
        </form>
    </div>
    <script src="../js/lib.js.js"><</script>
</body>
</html>
